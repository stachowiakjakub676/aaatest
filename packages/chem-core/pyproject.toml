[project]
name = "chem-core"
version = "0.1.0"
description = "Deterministic chemistry core for Molecular CAD: RDKit bridge, validation, properties"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chem_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
