[project]
name = "molecular-cad-api"
version = "0.1.0"
description = "FastAPI service exposing the deterministic chemistry core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chem-core",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ai = ["anthropic>=0.60"]

[tool.uv.sources]
chem-core = { path = "../../packages/chem-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../packages/chem-core/src"]
