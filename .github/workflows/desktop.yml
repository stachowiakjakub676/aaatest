name: Desktop installers

# Builds the Clapeyron desktop app (Tauri 2) for Windows, macOS and Linux on GitHub's runners,
# so no local Rust/WebView toolchain is needed. Run it from the Actions tab ("Run workflow"),
# or push a tag like v0.2.0 to also attach the installers to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (NSIS .exe + MSI)
            bundles: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            name: macOS (.dmg)
            bundles: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: Linux (AppImage + .deb)
            bundles: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux prerequisites (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: pnpm install --frozen-lockfile
      - name: Build the desktop app
        run: pnpm build:desktop
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          for f in ${{ matrix.bundles }}; do cp "$f" out/ 2>/dev/null || true; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: clapeyron-${{ runner.os }}
          path: out/*
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
