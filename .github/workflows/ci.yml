name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    name: TypeScript (model, web) and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: molecular-cad-single-file
          path: apps/web/dist/molecular-cad.html
          retention-days: 7

  python:
    name: Python (chem-core, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test chem-core
        working-directory: packages/chem-core
        run: |
          uv venv
          uv pip install -e ".[dev]"
          .venv/bin/python -m pytest -q
      - name: Test api
        working-directory: services/api
        run: |
          uv venv
          uv pip install -e ".[dev]"
          .venv/bin/python -m pytest -q
