[package]
name = "molecular-cad-desktop"
version = "0.1.0"
description = "Clapeyron desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "molecular_cad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
